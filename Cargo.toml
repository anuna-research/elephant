[package]
name = "elephant"
version = "0.1.7"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://git.anuna.io/anuna-research/elephant"
description = "Speech-act coordination on shared defeasible theories — Elephant 2000 made computable"

[dependencies]
# Anuna stack (path deps; unpublished — SPEC-001 §1)
cbcl-core = { path = "../cbcl-rs/crates/cbcl-core", features = ["std", "serde"] }
cbcl-parser = { path = "../cbcl-rs/crates/cbcl-parser", features = ["std", "serde"] }
spindle-core = { path = "../spindle-rust/crates/spindle-core", features = ["serde"] }
spindle-parser = { path = "../spindle-rust/crates/spindle-parser" }
spindle-contract = { path = "../spindle-rust/crates/spindle-contract" }
did-crdt = { path = "../did-crdt" } # default features = pure core (ADR-003)

# CRDT corpus (ADR-002)
loro = "1.13"

# Crypto & ids
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# E2EE — MLS (SPEC-004 ADR-301; same stack as ../hark)
openmls = "0.8"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
openmls_traits = "0.5"
tls_codec = "0.4"
base64 = "0.22"

# P2P join (SPEC-002): SPAKE2 + DHT rendezvous
spake2 = "0.4"
hmac = "0.12"
iroh = "1.0"
iroh-mainline-address-lookup = "0.4"
base64ct = { version = "1", features = ["alloc"] }

# CLI & serialisation
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Daemon (SPEC-002; hark pattern: loopback axum + discovery record + flock)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
axum = "0.8"
fs2 = "0.4"
ureq = { version = "2", features = ["json"] }
async-stream = "0.3"
futures-core = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
criterion = "0.5"
which = "7"

[[bench]]
name = "closure"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
