# elephant release pipeline — Forgejo Actions.
#
# This is the migration of the former .woodpecker/release.yaml (which ran on
# ci.codeberg.org) to the Anuna Forgejo instance at git.anuna.io. Triggered by
# pushing a tag like `v0.1.0` (see ./release.sh). Cross-compiles the four
# prebuilt binaries that scripts/install.sh downloads
#   elephant-darwin-arm64  elephant-darwin-x64  elephant-linux-x64  elephant-linux-arm64
# each with a matching .sha256, then publishes them (plus install.sh) to
# Cloudflare R2 (bucket anuna-files) so they are served at
#   https://files.anuna.io/elephant/            <- flat "latest", what install.sh reads
#   https://files.anuna.io/elephant/<tag>/      <- immutable per-release archive
#
# Everything builds on a single Linux `ubuntu-latest` runner, including the
# darwin artifacts (via osxcross + the macOS SDK) — the Forgejo runners are
# Linux-only, exactly as Codeberg's were. elephant's TLS stack is rustls/ring
# (no openssl, no aws-lc: iroh, openmls_rust_crypto and ureq all resolve to
# ring), so the cross-builds need only the target C toolchain — no
# libssl-dev:arm64 and no vendored-openssl gymnastics.
#
# Unlike the Woodpecker version (where each step was a fresh container), this is
# ONE job so all steps share the workspace. Two consequences worth knowing:
# the siblings are cloned ONCE rather than per step, and the osxcross toolchain
# is built once and reused by both darwin targets (the `[ -d /tmp/osxcross ]`
# guard) instead of being rebuilt from scratch for each.
#
# elephant depends on THREE sibling repos via path deps (Cargo.toml), all
# public on git.anuna.io and cloned anonymously over HTTPS:
#   ../cbcl-rs      (crates cbcl-core, cbcl-parser)
#   ../spindle-rust (crates spindle-core, spindle-parser, spindle-contract)
#   ../did-crdt     (identity)
# Each is checked out at a PINNED commit: Cargo's `--locked` pins the dependency
# graph but cannot pin path-dependency *contents*, so building against a moving
# branch would let an unrelated sibling change silently alter an elephant
# release. Bump the *_REF pins deliberately in the release-prep commit, in step
# with the Cargo.lock you tested against locally.
#
# PIN SHAs ARE FORGE-SPECIFIC. git.anuna.io/anuna-research/spindle-rust does not
# share history with the old Codeberg mirror — its history was rewritten to
# purge build artifacts, so every commit has a different SHA for identical
# content. The SPINDLE_RUST_REF below (b8597202) is the git.anuna.io commit
# whose *tree* is byte-identical to the Codeberg pin the Woodpecker pipeline
# used (e980c9e, tree ac191096). Verify a new pin by tree, not by message:
#   git -C ../spindle-rust rev-parse <sha>^{tree}
#
# elephant has a heavy [profile.release] (lto = true, codegen-units = 1) over a
# large dependency tree (iroh, openmls, loro). Full LTO links are memory-hungry;
# the three cross-compiled targets soften to thin LTO + 16 codegen units. The
# linux-x64 build keeps full LTO — it is the native host target with a
# well-behaved linker. If it ever OOMs on a runner, prefix its cargo build with
# the same two env vars.
#
# Required Forgejo Actions secrets (Settings -> Actions -> Secrets on the
# git.anuna.io/anuna-research/elephant repo). These are the same Cloudflare R2
# credentials the Codeberg pipeline used; re-add them here — the R2 bucket and
# files.anuna.io serving are unchanged by the migration:
#   CF_R2_ACCESS_KEY_ID  CF_R2_SECRET_ACCESS_KEY  CF_ACCOUNT_ID

name: release

on:
  push:
    tags:
      - 'v*'

# The pinned sibling commits elephant releases build against. Bump per release,
# in lockstep with the Cargo.lock you tested locally, and keep them equal to
# .forgejo/workflows/ci.yaml so the gate tests what the release ships.
env:
  CBCL_RS_REF: febc6691e6dd2d5f7116b1a4d84c984b64717564
  SPINDLE_RUST_REF: ede0ec27bb35abff1b8f9b4cb2af6747bd796049
  DID_CRDT_REF: adb5c7ac1423173f00201cddffa60fe672fb2a53

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone + pin the sibling path dependencies
        # Cloned to the sibling paths the `../<name>` path deps resolve to,
        # relative to the elephant checkout. All public, so no token is needed.
        run: |
          clone_pin() {
            [ -d "../$1" ] || git clone "https://git.anuna.io/anuna-research/$1.git" "../$1"
            git -C "../$1" checkout --detach "$2"
          }
          clone_pin cbcl-rs      "$CBCL_RS_REF"
          clone_pin spindle-rust "$SPINDLE_RUST_REF"
          clone_pin did-crdt     "$DID_CRDT_REF"

      - name: Ensure Rust toolchain
        # The Forgejo runner image ships node/git/curl but NOT rustup, and may
        # lack a base C toolchain (ring compiles a little C/asm; the per-target
        # cross toolchains are installed by the build steps below). Install both
        # if absent; appending to $GITHUB_PATH exposes cargo to later steps.
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          if ! command -v cc >/dev/null 2>&1; then
            $SUDO apt-get update && $SUDO apt-get install -y build-essential pkg-config curl
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustc --version
          cargo --version

      - name: Build linux-x64
        # Native host target: keep full LTO (the shipped default). See the
        # header note if this OOMs.
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/elephant dist/elephant-linux-x64
          cd dist && sha256sum elephant-linux-x64 > elephant-linux-x64.sha256

      - name: Build linux-arm64
        # ring (via iroh/openmls/ureq) compiles a little C/asm for the target,
        # so it needs the aarch64 cross toolchain (compiler + linker). No system
        # libraries beyond that — elephant pulls no openssl-sys.
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO apt-get update && $SUDO apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          # Soften LTO for the cross-link (OOM mitigation; see header).
          export CARGO_PROFILE_RELEASE_LTO=thin
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          cargo build --release --locked --target aarch64-unknown-linux-gnu
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/elephant dist/elephant-linux-arm64
          cd dist && sha256sum elephant-linux-arm64 > elephant-linux-arm64.sha256

      - name: Install osxcross toolchain (macOS SDK)
        # Built once against the macOS SDK; both darwin targets below reuse
        # /tmp/osxcross. Same recipe the hark pipeline uses. Under Woodpecker
        # this ran twice (one container per step); here it runs once.
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO apt-get update && $SUDO apt-get install -y clang cmake patch xz-utils libxml2-dev
          if [ ! -d /tmp/osxcross ]; then
            git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
            curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz \
              -o /tmp/osxcross/tarballs/MacOSX14.5.sdk.tar.xz
            ( cd /tmp/osxcross && UNATTENDED=1 ./build.sh )
          fi

      - name: Build darwin-arm64
        run: |
          export PATH="/tmp/osxcross/target/bin:$PATH"
          export CC_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang
          export CXX_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang++
          export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=aarch64-apple-darwin23.5-clang
          export CARGO_PROFILE_RELEASE_LTO=thin
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          rustup target add aarch64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/elephant dist/elephant-darwin-arm64
          cd dist && sha256sum elephant-darwin-arm64 > elephant-darwin-arm64.sha256

      - name: Build darwin-x64
        run: |
          export PATH="/tmp/osxcross/target/bin:$PATH"
          export CC_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang
          export CXX_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang++
          export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=x86_64-apple-darwin23.5-clang
          export CARGO_PROFILE_RELEASE_LTO=thin
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/elephant dist/elephant-darwin-x64
          cd dist && sha256sum elephant-darwin-x64 > elephant-darwin-x64.sha256

      - name: Create release metadata
        run: |
          # The installer the curl one-liner fetches, shipped alongside the binaries.
          cp scripts/install.sh dist/install.sh
          # Optional machine-readable pointer (install.sh does not require it, but
          # it mirrors the sibling repos and lets tooling resolve the latest version).
          cat > dist/version.json << EOF
          {
            "version": "${GITHUB_REF_NAME#v}",
            "download_url": "https://files.anuna.io/elephant/${GITHUB_REF_NAME}"
          }
          EOF
          ls -la dist/

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Ensure the AWS CLI is available (the R2 S3-compatible endpoint).
          if ! command -v aws >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
            $SUDO apt-get update && $SUDO apt-get install -y awscli
          fi

          export AWS_DEFAULT_REGION=auto
          export R2_ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export BUCKET="anuna-files"
          export PROJECT="elephant"

          # Flat prefix = the "latest" the curl installer reads
          # (https://files.anuna.io/elephant/elephant-<os>-<arch> and
          # .../install.sh), plus an immutable per-tag archive at elephant/<tag>/.
          for file in dist/elephant-* dist/install.sh dist/version.json; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            aws s3 cp "$file" "s3://${BUCKET}/${PROJECT}/${name}"                    --endpoint-url "$R2_ENDPOINT"
            aws s3 cp "$file" "s3://${BUCKET}/${PROJECT}/${GITHUB_REF_NAME}/${name}" --endpoint-url "$R2_ENDPOINT"
            echo "Uploaded: $name"
          done

          # Informational only, and non-fatal: an "Object Read & Write" R2 token
          # can PutObject (the uploads above) but may lack bucket ListBucket.
          echo "Files in ${PROJECT}/ (latest):"
          aws s3 ls "s3://${BUCKET}/${PROJECT}/" --endpoint-url "$R2_ENDPOINT" || echo "(list not permitted by this token; the uploads above succeeded)"
          echo ""
          echo "Release available at:"
          echo "  https://files.anuna.io/${PROJECT}/"
          echo "  https://files.anuna.io/${PROJECT}/${GITHUB_REF_NAME}/"
          echo "Install: curl https://files.anuna.io/${PROJECT}/install.sh | sh"
