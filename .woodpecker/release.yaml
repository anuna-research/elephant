#
# elephant release pipeline.
#
# Triggered by pushing a tag like `v0.1.0` (see ./release.sh). Cross-compiles
# the four prebuilt binaries that scripts/install.sh downloads
#   elephant-darwin-arm64  elephant-darwin-x64  elephant-linux-x64  elephant-linux-arm64
# each with a matching .sha256, then publishes them (plus install.sh) to
# Cloudflare R2 (bucket anuna-files) so they are served at
#   https://files.anuna.io/elephant/            <- flat "latest", what install.sh reads
#   https://files.anuna.io/elephant/<tag>/      <- immutable per-release archive
#
# Everything builds from Linux rust:1-bookworm containers, including the darwin
# artifacts (via osxcross + the macOS SDK) — Codeberg's hosted runners are
# Linux-only. elephant's TLS stack is rustls/ring (no openssl, no aws-lc: iroh,
# openmls_rust_crypto, and ureq all resolve to ring), so the cross-builds need
# only the target C toolchain — no libssl-dev:arm64 and no vendored-openssl
# gymnastics (unlike the zetl pipeline, which pulls libgit2/openssl-sys).
#
# elephant depends on THREE sibling repos via path deps (Cargo.toml), all
# public on Codeberg and cloned anonymously over HTTPS:
#   ../cbcl-rs      (crates cbcl-core, cbcl-parser)
#   ../spindle-rust (crates spindle-core, spindle-parser)
#   ../did-crdt     (identity)
# Each build step clones all three as siblings and checks out a PINNED commit:
# Cargo's `--locked` cannot pin path-dependency *contents*, so building against
# a moving branch would let an unrelated sibling change silently alter an
# elephant release. Bump the *_REF pins deliberately in the release-prep commit,
# keeping them in step with the Cargo.lock you tested against locally.
#
# elephant has a heavy [profile.release] (lto = true, codegen-units = 1) over a
# large dependency tree (iroh, openmls, loro). Full LTO links are memory-hungry;
# the three cross-compiled targets soften to thin LTO + 16 codegen units (the
# same OOM mitigation the zetl pipeline uses for its cross-links). linux-x64
# keeps full LTO — it is the native host target with a well-behaved linker. If
# it ever OOMs on a runner, prefix its cargo build with the same two env vars.
#
# Required Woodpecker secrets (same R2 credentials the hark/zetl pipelines use):
#   cf_r2_access_key_id  cf_r2_secret_access_key  cf_account_id

when:
  - event: tag
    branch: main

variables:
  - &rust_image rust:1-bookworm
  # The pinned sibling commits elephant releases build against. Bump per
  # release, in lockstep with the Cargo.lock you tested locally. Each repo is
  # cloned to the sibling path its `../<name>` path dep resolves to.
  - &clone_siblings |
    CBCL_RS_REF=1c6fa8f581a69a7bcb88fb787fa37c81f5de4221
    SPINDLE_RUST_REF=9764180288fc647084db77bcec9b73708d40f851
    DID_CRDT_REF=06842517a9c66225f75786dd9935256c0f6ec0d4
    if [ ! -d ../cbcl-rs ]; then
      git clone https://codeberg.org/anuna/cbcl-rs.git ../cbcl-rs
    fi
    git -C ../cbcl-rs checkout --detach "$CBCL_RS_REF"
    if [ ! -d ../spindle-rust ]; then
      git clone https://codeberg.org/anuna/spindle-rust.git ../spindle-rust
    fi
    git -C ../spindle-rust checkout --detach "$SPINDLE_RUST_REF"
    if [ ! -d ../did-crdt ]; then
      git clone https://codeberg.org/anuna/did-crdt.git ../did-crdt
    fi
    git -C ../did-crdt checkout --detach "$DID_CRDT_REF"

steps:
  - name: build-linux-x64
    image: *rust_image
    commands:
      - *clone_siblings
      # Native host target: keep full LTO (the shipped default). See the header
      # note if this OOMs.
      - cargo build --release --locked --target x86_64-unknown-linux-gnu
      - mkdir -p dist
      - cp target/x86_64-unknown-linux-gnu/release/elephant dist/elephant-linux-x64
      - cd dist && sha256sum elephant-linux-x64 > elephant-linux-x64.sha256 && cd ..

  - name: build-linux-arm64
    image: *rust_image
    commands:
      - *clone_siblings
      # ring (via iroh/openmls/ureq) compiles a little C/asm for the target, so
      # it needs the aarch64 cross toolchain (compiler + linker). No system
      # libraries beyond that — elephant pulls no openssl-sys.
      - apt-get update && apt-get install -y gcc-aarch64-linux-gnu
      - rustup target add aarch64-unknown-linux-gnu
      - export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
      - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
      # Soften LTO for the cross-link (OOM mitigation; see header).
      - CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 cargo build --release --locked --target aarch64-unknown-linux-gnu
      - mkdir -p dist
      - cp target/aarch64-unknown-linux-gnu/release/elephant dist/elephant-linux-arm64
      - cd dist && sha256sum elephant-linux-arm64 > elephant-linux-arm64.sha256 && cd ..

  - name: build-darwin-arm64
    image: *rust_image
    commands:
      - *clone_siblings
      - apt-get update && apt-get install -y clang cmake patch xz-utils libxml2-dev
      - rustup target add aarch64-apple-darwin
      - |
        # Build the osxcross toolchain against the macOS SDK (same recipe the
        # hark/zetl pipelines use). Keep the SDK download, PATH/CC exports and
        # the cargo build in one shell block so the cross env is in scope at
        # link. Soften LTO for the cross-link (OOM mitigation; see header).
        [ -d /tmp/osxcross ] || git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
        cd /tmp/osxcross
        curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz -o tarballs/MacOSX14.5.sdk.tar.xz
        UNATTENDED=1 ./build.sh
        cd -
        export PATH="/tmp/osxcross/target/bin:$PATH"
        export CC_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang
        export CXX_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang++
        export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=aarch64-apple-darwin23.5-clang
        CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 cargo build --release --locked --target aarch64-apple-darwin
        mkdir -p dist
        cp target/aarch64-apple-darwin/release/elephant dist/elephant-darwin-arm64
        cd dist && sha256sum elephant-darwin-arm64 > elephant-darwin-arm64.sha256 && cd ..

  - name: build-darwin-x64
    image: *rust_image
    commands:
      - *clone_siblings
      - apt-get update && apt-get install -y clang cmake patch xz-utils libxml2-dev
      - rustup target add x86_64-apple-darwin
      - |
        [ -d /tmp/osxcross ] || git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
        cd /tmp/osxcross
        curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz -o tarballs/MacOSX14.5.sdk.tar.xz
        UNATTENDED=1 ./build.sh
        cd -
        export PATH="/tmp/osxcross/target/bin:$PATH"
        export CC_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang
        export CXX_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang++
        export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=x86_64-apple-darwin23.5-clang
        CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 cargo build --release --locked --target x86_64-apple-darwin
        mkdir -p dist
        cp target/x86_64-apple-darwin/release/elephant dist/elephant-darwin-x64
        cd dist && sha256sum elephant-darwin-x64 > elephant-darwin-x64.sha256 && cd ..

  - name: create-metadata
    image: alpine:3
    commands:
      - apk add --no-cache coreutils
      # The installer the curl one-liner fetches, shipped alongside the binaries.
      - cp scripts/install.sh dist/install.sh
      # Optional machine-readable pointer (install.sh does not require it, but it
      # mirrors the sibling repos and lets tooling resolve the latest version).
      - |
        cat > dist/version.json << EOF
        {
          "version": "${CI_COMMIT_TAG#v}",
          "download_url": "https://files.anuna.io/elephant/${CI_COMMIT_TAG}"
        }
        EOF
      - ls -la dist/

  - name: upload-to-cloudflare-r2
    image: amazon/aws-cli:2.15.0
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: cf_r2_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: cf_r2_secret_access_key
      CF_ACCOUNT_ID:
        from_secret: cf_account_id
    commands:
      - export AWS_DEFAULT_REGION=auto
      - export R2_ENDPOINT="https://$${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - export BUCKET="anuna-files"
      - export PROJECT="elephant"

      # Flat prefix = the "latest" the curl installer reads
      # (https://files.anuna.io/elephant/elephant-<os>-<arch> and .../install.sh),
      # plus an immutable per-tag archive at elephant/<tag>/.
      - |
        for file in dist/elephant-* dist/install.sh dist/version.json; do
          [ -f "$$file" ] || continue
          name=$$(basename "$$file")
          aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$$name"                    --endpoint-url "$$R2_ENDPOINT"
          aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/$$name"  --endpoint-url "$$R2_ENDPOINT"
          echo "Uploaded: $$name"
        done

      # Informational only, and non-fatal: an "Object Read & Write" R2 token can
      # PutObject (the uploads above) but may lack bucket ListBucket, and this
      # step runs under `set -e`.
      - echo "Files in $${PROJECT}/ (latest):"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/" --endpoint-url "$$R2_ENDPOINT" || echo "(list not permitted by this token; the uploads above succeeded)"
      - echo ""
      - echo "Release available at:"
      - echo "  https://files.anuna.io/$${PROJECT}/"
      - echo "  https://files.anuna.io/$${PROJECT}/$${CI_COMMIT_TAG}/"
      - 'echo "Install: curl https://files.anuna.io/$${PROJECT}/install.sh | sh"'
